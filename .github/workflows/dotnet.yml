name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # МЕНЯЕМ ubuntu-latest на windows-latest
    runs-on: windows-latest 

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore CalculatorApp.sln

    - name: Build
      run: msbuild CalculatorApp.sln /p:Configuration=Release

    - name: Test
      run: dotnet test --no-build --verbosity normal
